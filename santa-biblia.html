<script>
(function(){
  "use strict";

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ IMAGEN DE FONDO (nebulosa) ============ */
  const WM = (file) => `https://commons.wikimedia.org/wiki/Special:FilePath/${file}?width=1600`;
  const IMG = { carinaGold: WM('Carina_Nebula_JWST.jpg') };

  function loadImageInto(imgEl, urlOrList, onSuccess){
    if(!urlOrList || !imgEl) return;
    const candidates = Array.isArray(urlOrList) ? urlOrList.slice() : [urlOrList];
    imgEl.referrerPolicy = 'no-referrer';
    function tryNext(){
      const next = candidates.shift();
      if(!next){ imgEl.removeAttribute('src'); return; }
      const onLoad = ()=>{ imgEl.classList.add('is-loaded'); cleanup(); if(onSuccess) onSuccess(); };
      const onError = ()=>{ cleanup(); tryNext(); };
      function cleanup(){ imgEl.removeEventListener('load', onLoad); imgEl.removeEventListener('error', onError); }
      imgEl.addEventListener('load', onLoad, { once:true });
      imgEl.addEventListener('error', onError, { once:true });
      imgEl.src = next;
    }
    tryNext();
  }
  loadImageInto(document.getElementById('sacredPhoto'), IMG.carinaGold);

  /* ============ CANVAS: CAMPO DE PARTÍCULAS DORADAS ============ */
  function makeField(canvas, opts){
    const ctx = canvas.getContext('2d');
    let w, h, dpr = Math.min(window.devicePixelRatio||1, 2);
    let stars = [], blobs = [], running = true, raf;

    function resize(){
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = w*dpr; canvas.height = h*dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const starCount = Math.round((w*h)/9000);
      stars = Array.from({length:starCount}, ()=>({
        x:Math.random()*w, y:Math.random()*h,
        r:Math.random()*1.3+0.2, tw:Math.random()*Math.PI*2, sp:Math.random()*0.02+0.005
      }));
      blobs = opts.colors.map((c,i)=>({
        x:Math.random()*w, y:Math.random()*h,
        r:Math.max(w,h)*(0.32+Math.random()*0.18),
        c, dx:(Math.random()-0.5)*0.15, dy:(Math.random()-0.5)*0.15
      }));
    }

    function draw(t){
      ctx.clearRect(0,0,w,h);
      if(!opts.transparentBg){ ctx.fillStyle = opts.bg; ctx.fillRect(0,0,w,h); }
      blobs.forEach(b=>{
        if(!reduceMotion){ b.x += b.dx; b.y += b.dy; }
        if(b.x < -b.r) b.x = w+b.r; if(b.x > w+b.r) b.x = -b.r;
        if(b.y < -b.r) b.y = h+b.r; if(b.y > h+b.r) b.y = -b.r;
        const g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
        g.addColorStop(0, b.c); g.addColorStop(1,'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      });
      ctx.fillStyle = '#fff';
      stars.forEach(s=>{
        const a = reduceMotion ? 0.75 : 0.4 + Math.abs(Math.sin(t*s.sp + s.tw))*0.6;
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function loop(t){
      draw((t||0)/1000);
      if(running && !reduceMotion) raf = requestAnimationFrame(loop);
    }
    resize();
    draw(0);
    if(!reduceMotion) raf = requestAnimationFrame(loop);
    window.addEventListener('resize', resize);

    return {
      pause(){ running=false; cancelAnimationFrame(raf); },
      resume(){ if(running) return; running=true; raf=requestAnimationFrame(loop); },
      isRunning(){ return running; }
    };
  }

  const sacredField = makeField(document.getElementById('sacredCanvas'), {
    bg:'#0d0602',
    colors:['rgba(232,192,125,0.32)','rgba(255,159,64,0.16)','rgba(120,70,20,0.3)']
  });

  const sacredSection = document.getElementById('dorado');
  const sacredPreviewBtn = document.getElementById('sacredPreviewBtn');
  let sacredUserPaused = false;
  sacredPreviewBtn.addEventListener('click', ()=>{
    sacredUserPaused = sacredField.isRunning();
    if(sacredUserPaused){
      sacredField.pause();
      sacredSection.classList.add('is-paused');
      sacredPreviewBtn.textContent = 'Reanudar el resplandor';
    } else {
      sacredField.resume();
      sacredSection.classList.remove('is-paused');
      sacredPreviewBtn.textContent = 'Detener el resplandor';
    }
  });

  // pausa el campo de partículas cuando la sección no está visible (rendimiento)
  const fieldIo = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.target !== document.getElementById('sacredCanvas')) return;
      if(sacredUserPaused) return;
      if(entry.isIntersecting) sacredField.resume(); else sacredField.pause();
    });
  }, { threshold:0.05 });
  fieldIo.observe(document.getElementById('sacredCanvas'));

  /* ============ SAGRADA BIBLIA — DATOS ============
     ZONA DE INTEGRACIÓN FUTURA: aquí se cargará el JSON completo de la Biblia.
     Hoy BOOK_PAGES contiene 7 pasajes curados a mano; cuando el texto íntegro
     llegue desde un archivo externo, basta con sustituir este arreglo por el
     resultado de un fetch() con la misma forma { tag, section, icon, verse,
     spirit, science } (o extenderla) — renderBookPage/renderIndexPage no
     necesitan cambios porque ya leen de BOOK_PAGES dinámicamente. */
  const BOOK_PAGES = [
    { tag:"Génesis 1:1", section:"La Creación y el Cosmos", icon:"genesis", motif:"Una esfera de luz que nace de la oscuridad", verse:"«En el principio creó Dios los cielos y la tierra.»",
      spirit:"El primer verso de las Escrituras no explica cómo, solo declara que hubo un origen: un principio antes del cual no había nada.",
      science:"El modelo del Big Bang describe ese mismo umbral: hace 13 800 millones de años, el universo observable comenzó a expandirse desde un estado extremadamente denso y caliente." },
    { tag:"Salmos 19:1", section:"El Testimonio del Cielo", icon:"salmos", motif:"Un cielo nocturno tejido de constelaciones", verse:"«Los cielos cuentan la gloria de Dios, y el firmamento anuncia la obra de sus manos.»",
      spirit:"Un salmo de asombro: el cielo nocturno como testimonio silencioso, visible a cualquiera que mire hacia arriba.",
      science:"Cada punto de luz que vemos a simple vista es una estrella real, algunas a miles de años luz. Contemplar el cielo es, literalmente, mirar el pasado." },
    { tag:"Job 26:7", section:"Suspendida sobre el Vacío", icon:"job", motif:"La Tierra colgada de la nada, sin columnas", verse:"«Él extiende el norte sobre el vacío, cuelga la tierra sobre nada.»",
      spirit:"Una imagen notable para su época: un mundo sostenido sin columnas visibles, suspendido en el vacío.",
      science:"Hoy sabemos que la Tierra orbita en el vacío del espacio, sostenida únicamente por la gravedad del Sol, sin ningún soporte físico." },
    { tag:"Isaías 40:22", section:"El Círculo de la Tierra", icon:"isaias", motif:"El horizonte curvado en un círculo perfecto", verse:"«Él está sentado sobre el círculo de la tierra…»",
      spirit:"Una descripción poética de la totalidad del mundo, visto desde una perspectiva que lo abarca por completo.",
      science:"La curvatura de la Tierra, invisible desde el suelo, es evidente desde la órbita: un círculo azul flotando sobre el negro del espacio." },
    { tag:"Juan 1:1-3", section:"El Verbo Creador", icon:"juan", motif:"La luz irradiando en orden desde el centro", verse:"«En el principio era el Verbo… todas las cosas por él fueron hechas.»",
      spirit:"El origen del cosmos se enlaza aquí con un orden y una razón subyacentes, no solo con un evento.",
      science:"El universo obedece leyes físicas consistentes y medibles en cualquier punto observado: la misma gravedad, la misma luz, en todas partes." },
    { tag:"Colosenses 1:16-17", section:"Todo Subsiste en Él", icon:"colosenses", motif:"Órbitas entrelazadas que no se disgregan", verse:"«En él fueron creadas todas las cosas… y todas las cosas en él subsisten.»",
      spirit:"Una afirmación de sostén continuo, no solo de un inicio: el cosmos permanece, momento a momento.",
      science:"Las constantes físicas fundamentales —la gravedad, la velocidad de la luz— se mantienen estables desde el origen del universo hasta hoy." },
    { tag:"Hebreos 11:3", section:"Lo Visible desde lo Invisible", icon:"hebreos", motif:"Media esfera de luz emergiendo de la sombra", verse:"«El universo fue constituido por la palabra de Dios, de modo que lo que se ve fue hecho de lo que no se veía.»",
      spirit:"Un recordatorio de que lo visible surge de lo invisible: la fe como forma de percibir un origen no observado directamente.",
      science:"La materia y energía oscuras —invisibles, indetectables de forma directa— componen cerca del 95% del universo, inferidas solo por sus efectos gravitacionales." }
  ];

  /* ============ SAGRADA BIBLIA — LÓGICA ============ */
  const book = document.getElementById('book');
  const bookCover = document.getElementById('bookCover');
  const bookOpen = document.getElementById('bookOpen');
  const bookPageLeft = document.getElementById('bookPageLeft');
  const bookPageRight = document.getElementById('bookPageRight');
  let bookIndex = 0;
  let lastPageIndex = -1;

  // envuelve cada carácter en un span con leve variación aleatoria, para que el texto
  // antiguo se lea como manuscrito a pluma y no como texto tipografiado plano
  const INK_TONES = ['#2c1c10', '#1a1008']; // marrón cálamo / casi negro — variación de presión de pluma
  function inkHtml(text){
    return [...text].map(ch=>{
      if(ch === ' ') return ' ';
      const r = (Math.random()*3.4 - 1.7).toFixed(2);
      const y = (Math.random()*2.6 - 1.3).toFixed(2);
      const o = (0.82 + Math.random()*0.18).toFixed(2);
      const tone = INK_TONES[Math.random() < 0.78 ? 0 : 1];
      const safe = ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<span class="ink-glyph" style="--r:${r}deg;--y:${y}px;color:${tone};opacity:${o}">${safe}</span>`;
    }).join('');
  }
  function inkifyEl(el){ if(el) el.innerHTML = inkHtml(el.textContent); }
  document.querySelectorAll('.book-cover-title').forEach(inkifyEl);
  document.querySelectorAll('.book-cover-sub').forEach(inkifyEl);

  let bookSealUid = 0;
  // estética de grabado/xilografía renacentista: tinta monocroma, trazos finos,
  // trama cruzada o punteado en vez de un relleno sólido plano
  function bookSeal(icon){
    const uid = bookSealUid++;
    const INK = '#3a2413';
    const hatchId = `bsHatch${uid}`, stippleId = `bsStipple${uid}`;
    const defs = `<defs>
      <pattern id="${hatchId}" width="4.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="4.2" stroke="${INK}" stroke-width="0.55" opacity="0.55"/>
        <line x1="2.1" y1="0" x2="2.1" y2="4.2" stroke="${INK}" stroke-width="0.32" opacity="0.32"/>
      </pattern>
      <pattern id="${stippleId}" width="5" height="5" patternUnits="userSpaceOnUse">
        <circle cx="1.3" cy="1.3" r="0.55" fill="${INK}" opacity="0.55"/>
        <circle cx="3.6" cy="3.4" r="0.4" fill="${INK}" opacity="0.4"/>
      </pattern>
    </defs>`;
    const rings = `<circle cx="100" cy="100" r="94" fill="none" stroke="${INK}" stroke-width="1" opacity="0.55"/>
      <circle cx="100" cy="100" r="74" fill="none" stroke="${INK}" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>`;
    const ticks = Array.from({length:12}).map((_,i)=>{
      const a = (i/12)*Math.PI*2;
      const x1=100+Math.cos(a)*88, y1=100+Math.sin(a)*88, x2=100+Math.cos(a)*96, y2=100+Math.sin(a)*96;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${INK}" stroke-width="1" opacity="0.5"/>`;
    }).join('');
    const hatchFill = `url(#${hatchId})`, stippleFill = `url(#${stippleId})`;
    let inner;
    switch(icon){
      case 'genesis': { // luz irrumpiendo desde la oscuridad — un nimbo solar grabado
        const rays = Array.from({length:16}).map((_,i)=>{
          const a=(i/16)*Math.PI*2; const x2=100+Math.cos(a)*44, y2=100+Math.sin(a)*44;
          return `<line x1="${(100+Math.cos(a)*22).toFixed(1)}" y1="${(100+Math.sin(a)*22).toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${INK}" stroke-width="${i%2?0.6:1}" opacity="0.6"/>`;
        }).join('');
        inner = `<circle cx="100" cy="100" r="21" fill="${stippleFill}"/><circle cx="100" cy="100" r="21" fill="none" stroke="${INK}" stroke-width="1.2"/>${rays}`;
        break;
      }
      case 'salmos':
        inner = [[70,72],[128,64],[112,96],[86,118],[132,120],[100,100],[64,108]]
          .map(([x,y],i)=> `<circle cx="${x}" cy="${y}" r="${i===5?3.2:2.1}" fill="${INK}"/>`).join('')
          + `<line x1="70" y1="72" x2="112" y2="96" stroke="${INK}" stroke-width="0.7" opacity="0.6"/>
             <line x1="112" y1="96" x2="132" y2="120" stroke="${INK}" stroke-width="0.7" opacity="0.6"/>
             <line x1="112" y1="96" x2="128" y2="64" stroke="${INK}" stroke-width="0.7" opacity="0.6"/>
             <line x1="86" y1="118" x2="64" y2="108" stroke="${INK}" stroke-width="0.7" opacity="0.6"/>`;
        break;
      case 'job':
        inner = `<line x1="100" y1="34" x2="100" y2="70" stroke="${INK}" stroke-width="1" stroke-dasharray="1 5" opacity="0.5"/>
          <circle cx="100" cy="108" r="20" fill="${hatchFill}"/><circle cx="100" cy="108" r="20" fill="none" stroke="${INK}" stroke-width="1.4"/>`;
        break;
      case 'isaias':
        inner = `<path d="M56 122 Q100 148 144 122" fill="none" stroke="${INK}" stroke-width="1" opacity="0.55"/>
          <circle cx="100" cy="98" r="24" fill="${hatchFill}"/><circle cx="100" cy="98" r="24" fill="none" stroke="${INK}" stroke-width="1.6"/>`;
        break;
      case 'juan':
        inner = Array.from({length:8}).map((_,i)=>{
          const a=(i/8)*Math.PI*2; const x2=100+Math.cos(a)*40, y2=100+Math.sin(a)*40;
          return `<line x1="100" y1="100" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${INK}" stroke-width="1.1" opacity="0.75"/>`;
        }).join('') + `<circle cx="100" cy="100" r="10" fill="${stippleFill}"/><circle cx="100" cy="100" r="10" fill="none" stroke="${INK}" stroke-width="1"/>`;
        break;
      case 'colosenses':
        inner = `<circle cx="88" cy="94" r="24" fill="none" stroke="${INK}" stroke-width="1.1" opacity="0.85"/>
          <circle cx="114" cy="94" r="24" fill="none" stroke="${INK}" stroke-width="1.1" opacity="0.85"/>
          <circle cx="101" cy="116" r="24" fill="none" stroke="${INK}" stroke-width="1.1" opacity="0.85"/>`;
        break;
      case 'hebreos':
        inner = `<path d="M100 74 A26 26 0 0 1 100 126 Z" fill="${hatchFill}"/><circle cx="100" cy="100" r="26" fill="none" stroke="${INK}" stroke-width="1.3"/>`;
        break;
      default:
        inner = `<circle cx="100" cy="100" r="22" fill="${stippleFill}"/><circle cx="100" cy="100" r="22" fill="none" stroke="${INK}" stroke-width="1.1"/>`;
    }
    return `<svg class="book-seal" viewBox="0 0 200 200" aria-hidden="true">${defs}${rings}${ticks}${inner}</svg>`;
  }

  /* ============ RENDER DE LAS DOS MITADES ============
     buildPageHtml/buildIndexHtml devuelven el HTML de la mitad izquierda y
     de la derecha por SEPARADO. Ese es el cambio que permite que la hoja
     que gira lleve contenido real en su frente y en su reverso, y que cada
     mitad se actualice justo en el instante en el que deja de estar a la
     vista (sin parpadeos ni contenido que aparece antes de tiempo).
     BOOK_PAGES y el marcado generado son idénticos a los anteriores. */
  function buildPageHtml(i){
    const p = BOOK_PAGES[i];
    const prevLabel = i>0 ? `← ${BOOK_PAGES[i-1].tag}` : '← Índice';
    const prevAttrs = i>0 ? `data-action="open-page" data-index="${i-1}" data-direction="backward"` : `data-action="open-index" data-direction="backward"`;
    const nextLabel = i<BOOK_PAGES.length-1 ? `${BOOK_PAGES[i+1].tag} →` : 'Índice →';
    const nextAttrs = i<BOOK_PAGES.length-1 ? `data-action="open-page" data-index="${i+1}" data-direction="forward"` : `data-action="open-index" data-direction="forward"`;
    return {
      left: `
      <button class="book-to-index" data-action="open-index" data-direction="backward" type="button">← Índice</button>
      ${bookSeal(p.icon)}
      <p class="book-left-tag ink-label">${p.tag}</p>`,
      right: `
      <p class="book-page-tag ink-label">${p.tag}</p>
      <p class="book-verse ink">${inkHtml(p.verse)}</p>
      <div class="book-divider"></div>
      <div class="book-gloss-block"><h5 class="ink-label">Interpretación espiritual</h5><p class="ink">${inkHtml(p.spirit)}</p></div>
      <div class="book-gloss-block"><h5 class="ink-label">Contexto científico</h5><p class="ink">${inkHtml(p.science)}</p></div>
      <div class="book-page-nav">
        <button class="book-pill" ${prevAttrs} type="button">${prevLabel}</button>
        <button class="book-pill is-primary" data-action="open-index" data-direction="backward" type="button">Índice</button>
        <button class="book-pill" ${nextAttrs} type="button">${nextLabel}</button>
      </div>`
    };
  }

  function buildIndexHtml(){
    const intro = BOOK_PAGES[0];
    const hasProgress = lastPageIndex >= 0;
    const continueTarget = hasProgress ? (lastPageIndex+1) % BOOK_PAGES.length : 0;
    return {
      left: `
      ${bookSeal(intro.icon)}
      <p class="book-left-title ink">${inkHtml(intro.section)}</p>
      <p class="book-left-quote ink">${inkHtml('«' + intro.verse.replace(/[«»]/g,'') + '»')}</p>`,
      right: `
      <h3 class="book-index-title ink">${inkHtml(intro.section)}</h3>
      ${hasProgress ? `<button class="book-continue" data-action="open-page" data-index="${continueTarget}" data-direction="forward" type="button">↺ Continuar en ${BOOK_PAGES[continueTarget].tag}</button>` : ''}
      <div class="book-index-list">
        ${BOOK_PAGES.map((pg,idx)=> `<button class="book-index-row" data-action="open-page" data-index="${idx}" data-direction="forward" type="button"><span>${pg.tag}</span><span class="book-index-num">${String(idx+1).padStart(2,'0')}</span></button>`).join('')}
      </div>`
    };
  }

  /* API previa intacta: renderBookPage/renderIndexPage siguen existiendo y
     escribiendo las dos mitades de una vez, como antes. */
  function renderBookPage(i){
    const h = buildPageHtml((i + BOOK_PAGES.length) % BOOK_PAGES.length);
    bookPageLeft.innerHTML = h.left;
    bookPageRight.innerHTML = h.right;
  }
  function renderIndexPage(){
    const h = buildIndexHtml();
    bookPageLeft.innerHTML = h.left;
    bookPageRight.innerHTML = h.right;
  }
  function buildView(view){
    return view.type === 'index'
      ? buildIndexHtml()
      : buildPageHtml((view.index + BOOK_PAGES.length) % BOOK_PAGES.length);
  }

  /* ============ SONIDO DEL PASO DE PÁGINA ============
     UN solo AudioContext para toda la página, creado de forma perezosa
     dentro del primer gesto del usuario (política de autoplay del
     navegador). Si el audio no está disponible no se lanza ningún error.

     El efecto se sintetiza sobre ruido ROSA pregenerado y normalizado una
     única vez —el ruido blanco anterior sonaba a siseo digital— y combina
     dos capas:
       1) el roce del papel: paso de banda ancho (Q 0.5) que cae de ~3.4 kHz
          a ~900 Hz mientras la hoja se despega, con ataque de 14 ms;
       2) un pequeño golpe de aire: paso bajo grave, más lento y claramente
          por debajo del roce (26% de su nivel).
     Medido con OfflineAudioContext: pico ≈ 0.14 y cola audible ≈ 300 ms,
     es decir, discreto y dentro del rango pedido de 200–500 ms. El
     compresor suave evita saturación al pasar páginas muy rápido y un
     ligero jitter aleatorio impide que dos pasos suenen idénticos. */
  const PageSound = (function(){
    let ctx = null, noise = null, master = null, tried = false;
    // ganancia del bus: calibrada para un pico de ~0.14 (discreto pero
    // audible). Ajustable en caliente con SantaBibliaAudio.setVolume().
    let volume = 0.55;

    function init(){
      if(tried) return ctx;
      tried = true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try { ctx = new AC(); } catch(err){ ctx = null; return null; }

      master = ctx.createGain();
      master.gain.value = volume;
      let tail = master;
      if(typeof ctx.createDynamicsCompressor === 'function'){
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 6;
        comp.attack.value = 0.004;  comp.release.value = 0.14;
        master.connect(comp); tail = comp;
      }
      tail.connect(ctx.destination);

      // ruido rosa (Voss-McCartney aproximado) — se genera UNA sola vez y se
      // normaliza, para que el nivel final no dependa de la semilla aleatoria
      const len = Math.floor(ctx.sampleRate * 1.2);
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0, peak=0;
      for(let i=0;i<len;i++){
        const w = Math.random()*2-1;
        b0 = 0.99886*b0 + w*0.0555179;
        b1 = 0.99332*b1 + w*0.0750759;
        b2 = 0.96900*b2 + w*0.1538520;
        b3 = 0.86650*b3 + w*0.3104856;
        b4 = 0.55000*b4 + w*0.5329522;
        b5 = -0.7616*b5 - w*0.0168980;
        d[i] = b0+b1+b2+b3+b4+b5+b6 + w*0.5362;
        b6 = w*0.115926;
        if(Math.abs(d[i]) > peak) peak = Math.abs(d[i]);
      }
      if(peak > 0){ const k = 0.92/peak; for(let i=0;i<len;i++) d[i] *= k; }
      return ctx;
    }

    function layer(t0, o){
      const src = ctx.createBufferSource();
      src.buffer = noise; src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = o.type;
      f.frequency.setValueAtTime(o.f0, t0);
      f.frequency.exponentialRampToValueAtTime(o.f1, t0 + o.dur);
      if(o.q) f.Q.value = o.q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.peak, t0 + o.attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0, Math.random() * 0.8);
      src.stop(t0 + o.dur + 0.03);
    }

    function play(intensity){
      const c = init();
      if(!c || c.state === 'closed') return;
      if(c.state === 'suspended'){
        const r = c.resume();
        if(r && typeof r.catch === 'function') r.catch(function(){});
      }
      try{
        const now = c.currentTime + 0.005;
        const k = typeof intensity === 'number' ? Math.max(0, intensity) : 1;
        if(k <= 0) return;
        const j = 0.92 + Math.random()*0.18;
        // 1) roce de la hoja  2) golpe de aire, muy por debajo
        layer(now,         { type:'bandpass', q:0.5, f0:3400*j, f1:900, peak:1.00*k, attack:0.014, dur:0.42*j });
        layer(now + 0.050, { type:'lowpass',          f0:1100,  f1:380, peak:0.26*k, attack:0.060, dur:0.36*j });
      } catch(err){ /* el audio no está disponible — se omite en silencio */ }
    }

    return {
      play: play,
      setVolume: function(v){
        volume = Math.min(1, Math.max(0, Number(v) || 0));
        if(master) master.gain.value = volume;
        return volume;
      },
      getVolume: function(){ return volume; }
    };
  })();
  /* la función original sigue existiendo y funcionando igual que antes */
  function playPageSound(){ PageSound.play(reduceMotion ? 0.6 : 1); }
  // volumen configurable desde fuera, sin tocar el código
  window.SantaBibliaAudio = { setVolume: PageSound.setVolume, getVolume: PageSound.getVolume };

  /* ============ ESTADO DEL LIBRO ============ */
  const bookObject    = document.getElementById('bookObject');
  const pageFlip      = document.getElementById('pageFlip');
  const pageFlipFront = document.getElementById('pageFlipFront');
  const pageFlipBack  = document.getElementById('pageFlipBack');
  const singlePageMQ  = window.matchMedia('(max-width:760px), (max-height:470px)');
  let lastFocused = null;

  // mantiene coherentes las capas invisibles con el árbol de accesibilidad
  function syncA11y(){
    const opened = book.classList.contains('is-index') || book.classList.contains('is-page');
    bookOpen.setAttribute('aria-hidden', opened ? 'false' : 'true');
    if('inert' in bookOpen) bookOpen.inert = !opened;
    bookCover.setAttribute('aria-hidden', opened ? 'true' : 'false');
    bookCover.setAttribute('tabindex', opened ? '-1' : '0');
  }

  function applyView(view, parts){
    if(view.type === 'index'){
      book.classList.remove('is-cover','is-page','is-opening');
      book.classList.add('is-index');
    } else {
      bookIndex = (view.index + BOOK_PAGES.length) % BOOK_PAGES.length;
      lastPageIndex = bookIndex;
      book.classList.remove('is-cover','is-index','is-opening');
      book.classList.add('is-page');
    }
    if(parts){
      if(parts.right != null) bookPageRight.innerHTML = parts.right;
      if(parts.left  != null) bookPageLeft.innerHTML  = parts.left;
    }
    syncA11y();
  }

  function showCover(){
    book.classList.remove('is-index','is-page','is-opening');
    book.classList.add('is-cover');
    syncA11y();
  }
  function showIndex(){ applyView({ type:'index' }, buildIndexHtml()); }
  function showPage(i){ applyView({ type:'page', index:i }, buildPageHtml((i + BOOK_PAGES.length) % BOOK_PAGES.length)); }

  /* ============ "LEER EL PASAJE" — solo muestra la Biblia cerrada ============
     Este botón NUNCA abre el libro: solo prepara y muestra el modal con la
     cubierta cerrada, centrada y quieta. La apertura solo puede empezar
     tocando la propia Biblia (#bookCover). */
  let openingTimers = [];
  function clearOpeningTimers(){ openingTimers.forEach(clearTimeout); openingTimers = []; }

  function showBookCover(){
    clearOpeningTimers();
    endFlip(true);
    lastFocused = document.activeElement;
    book.classList.remove('is-opening','is-index','is-page');
    book.classList.add('is-cover','is-open');
    document.body.classList.add('book-modal-open');
    PageSound.play(0);   // crea el AudioContext dentro de un gesto, sin sonar
    // el pliego se compone AHORA, mientras solo se ve la cubierta cerrada:
    // así la apertura arranca sin ningún trabajo pesado por delante
    renderIndexPage();
    syncA11y();
    openingTimers.push(window.setTimeout(function(){ bookCover.focus({ preventScroll:true }); }, 60));
  }

  /* ============ "APERTURA SAGRADA DEL CÓDICE" ============
     Secuencia: cubierta cerrada → el libro se endereza sobre su lomo →
     la tapa gira 180° desde el lomo izquierdo → las hojas se levantan en
     cascada desde ese mismo lomo → el pliego completo (doble página) se
     revela progresivamente por debajo. Todo ocurre dentro del MISMO
     escenario, así que el libro no cambia de tamaño ni se sustituye. */
  function handleBookCoverActivation(){
    if(!book.classList.contains('is-open')) return;
    if(!book.classList.contains('is-cover')) return;
    if(book.classList.contains('is-opening')) return;
    startBookOpeningSequence();
  }

  function startBookOpeningSequence(){
    clearOpeningTimers();
    /* el contenido del pliego se compone ANTES de animar: la revelación
       progresiva del CSS (.book-open pasa de opacidad 0 a 1 a partir del
       52% de la apertura) muestra páginas ya maquetadas, nunca un "pop"
       de contenido al final. */
    // El pliego ya se compuso al abrir el modal (showBookCover): componerlo
    // aquí costaba ~200 ms de sellos SVG y glifos de tinta que retrasaban el
    // arranque del giro. Ahora la animación empieza en el mismo frame del clic.
    PageSound.play(reduceMotion ? 0.4 : 0.65);   // el cuero abriéndose, muy leve
    book.classList.remove('is-cover');
    book.classList.add('is-opening');

    const openDelay = reduceMotion ? 250 : 1180;  // == var(--open-dur)
    openingTimers.push(window.setTimeout(function(){
      applyView({ type:'index' });                // sin re-render: el HTML ya está
      bookOpen.focus({ preventScroll:true });
    }, openDelay));
  }

  /* ============ "PASO DE PÁGINA DEL CÓDICE" ============
     Animación totalmente independiente de la apertura: nunca reaparecen la
     cubierta, el destello ni el resplandor. Geometría única para las dos
     direcciones — la hoja ocupa siempre la mitad derecha y su bisagra es el
     pliegue central:
        avanzar     → gira de 0° a -180° (sale hacia la IZQUIERDA)
        retroceder  → gira de -180° a 0° (entra desde la IZQUIERDA)
     La cara frontal lleva la mitad derecha y la trasera la izquierda, con
     contenido REAL, de modo que el reverso del papel es el que le
     corresponde en un libro físico. */
  const FLIP_MS = reduceMotion ? 190 : 660;      // == var(--flip-dur)
  let flip = null;
  let lastSoundAt = 0;

  // cierra el giro en curso aplicando su estado final; es idempotente, así
  // que pulsar muy rápido nunca deja el libro en un estado a medias
  function endFlip(commit){
    if(!flip) return;
    const pending = flip;
    flip = null;
    clearTimeout(pending.timer);
    pageFlip.removeEventListener('animationend', pending.onEnd);
    pageFlip.classList.remove('is-active','is-forward','is-backward');
    if(commit !== false && typeof pending.land === 'function') pending.land();
  }

  function turnTo(view, direction){
    endFlip(true);

    const dir = direction === 'backward' ? 'backward' : 'forward';
    const single = singlePageMQ.matches;          // móvil / pantallas muy bajas
    const next = buildView(view);

    const now = (window.performance && performance.now) ? performance.now() : Date.now();
    if(now - lastSoundAt > 90){ lastSoundAt = now; PageSound.play(reduceMotion ? 0.5 : 1); }

    let land;
    if(dir === 'forward'){
      pageFlipFront.innerHTML = bookPageRight.innerHTML;      // la mitad que se abandona
      pageFlipBack.innerHTML  = single ? '' : next.left;      // su reverso = nueva mitad izquierda
      applyView(view, { right: next.right });                 // queda tapada por la hoja
      land = function(){ bookPageLeft.innerHTML = next.left; };
    } else {
      pageFlipFront.innerHTML = next.right;                   // la mitad que llega
      pageFlipBack.innerHTML  = single ? '' : bookPageLeft.innerHTML;
      applyView(view, single ? null : { left: next.left });
      land = function(){
        bookPageRight.innerHTML = next.right;
        if(single) bookPageLeft.innerHTML = next.left;
      };
    }

    pageFlip.classList.remove('is-active','is-forward','is-backward');
    void pageFlip.offsetWidth;                                // reinicia las animaciones CSS
    pageFlip.classList.add('is-active', dir === 'forward' ? 'is-forward' : 'is-backward');

    const state = { land:land, timer:0, onEnd:null };
    state.onEnd = function(e){ if(e.target === pageFlip) endFlip(true); };
    pageFlip.addEventListener('animationend', state.onEnd);
    // red de seguridad por si animationend no llega (pestaña en segundo plano)
    state.timer = window.setTimeout(function(){ endFlip(true); }, FLIP_MS + 120);
    flip = state;
  }

  function goRelative(step){
    if(book.classList.contains('is-index')){
      if(step > 0) turnTo({ type:'page', index:0 }, 'forward');
      return;
    }
    if(!book.classList.contains('is-page')) return;
    const target = bookIndex + step;
    if(target < 0 || target > BOOK_PAGES.length - 1) turnTo({ type:'index' }, step > 0 ? 'forward' : 'backward');
    else turnTo({ type:'page', index:target }, step > 0 ? 'forward' : 'backward');
  }

  function closeBook(){
    clearOpeningTimers();
    endFlip(true);
    book.classList.remove('is-open');
    document.body.classList.remove('book-modal-open');
    syncA11y();
    if(lastFocused && typeof lastFocused.focus === 'function'){
      try { lastFocused.focus({ preventScroll:true }); } catch(err){ /* elemento ya no existe */ }
    }
    // se espera al fundido de salida del modal antes de restablecer la
    // cubierta cerrada, para no mostrar el "salto" visual
    openingTimers.push(window.setTimeout(showCover, 520));
  }

  /* ============ EVENTOS ============ */
  document.getElementById('sacredOpenBtn').addEventListener('click', showBookCover);

  bookCover.addEventListener('click', handleBookCoverActivation);
  bookCover.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      handleBookCoverActivation();
    }
  });

  document.getElementById('bookClose').addEventListener('click', closeBook);

  book.addEventListener('click', function(e){
    const t = e.target.closest('[data-action]');
    if(t){
      const action = t.dataset.action;
      const direction = t.dataset.direction === 'backward' ? 'backward' : 'forward';
      if(action === 'open-index') turnTo({ type:'index' }, direction);
      else if(action === 'open-page') turnTo({ type:'page', index:+t.dataset.index }, direction);
      return;
    }
    if(e.target === book) closeBook();          // clic fuera del libro = cerrar
  });

  // teclado: Escape cierra, flechas navegan, Inicio vuelve al índice
  document.addEventListener('keydown', function(e){
    if(!book.classList.contains('is-open')) return;
    if(e.key === 'Escape'){ e.preventDefault(); closeBook(); return; }
    if(!book.classList.contains('is-index') && !book.classList.contains('is-page')) return;
    if(e.key === 'ArrowRight'){ e.preventDefault(); goRelative(1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); goRelative(-1); }
    else if(e.key === 'Home'){ e.preventDefault(); turnTo({ type:'index' }, 'backward'); }
  });

  // el foco no debe escaparse del modal mientras está abierto
  book.addEventListener('keydown', function(e){
    if(e.key !== 'Tab') return;
    const all = book.querySelectorAll('button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])');
    const list = Array.prototype.filter.call(all, function(el){
      return el.getClientRects().length > 0;
    });
    if(!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  syncA11y();

})();
</script>
</body>
</html>
